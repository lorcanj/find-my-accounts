<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>find my accounts</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="../assets/icon-48.png">
  <link rel="icon" type="image/png" sizes="128x128" href="../assets/icon-128.png">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>find my accounts</h1>
      <button id="popOutBtn" class="btn-link" title="Pop out" aria-label="Pop out">
        <!-- Icon: external-link from Feather Icons (MIT License) -->
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
    </div>
    
    <div id="importContainer" class="mt-1">
      <p class="muted">Choose an exported .mbox file (Google Takeout or Thunderbird). Files are processed entirely in your browser and never uploaded.</p>
      <div class="file-picker">
        <input id="mboxFileInput" type="file" accept=".mbox" />
        <div id="selectedFileInfo" aria-live="polite" class="file-info"></div>
        <div id="importProgress" class="progress hidden mt-0-5">
          <div
            id="importProgressBar"
            class="progress-bar"
            role="progressbar"
            aria-label="MBOX import progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0">
          </div>
        </div>
      </div>
      <div class="mt-0-5">
        <button id="importMboxBtn" class="btn btn-primary" disabled>Import .mbox</button>
      </div>
    </div>

    <div id="accountListContainer">
      <ul id="accountListPlaceholder"></ul>
    </div>

    <div id="downloadContainer" class="download-container">
      <button id="downloadAccounts" class="btn btn-secondary">Download Accounts</button>
    </div>
    
    <div id="loading" class="loading hidden">
      <p>Scanning...</p>
    </div>

    <div id="results" class="results">
      <h2 id="accounts-heading">Found Accounts: <span id="accountCount">0</span></h2>
      <div role="table" aria-labelledby="accounts-heading">
        <div class="account-list-headers" role="row">
          <div class="col name" role="columnheader">Account name</div>
          <div class="col difficulty" role="columnheader">Deletion difficulty</div>
          <div class="col action" role="columnheader">Link to delete</div>
        </div>
        <ul id="accountList" class="account-list" role="rowgroup">
          <!-- Accounts will be added here by popup.js -->
        </ul>
      </div>
    </div>

    <div id="error" class="error hidden">
      <!-- Error messages will appear here -->
    </div>
    <!-- Add this to popup.html, e.g., at the bottom of the popup -->
    <div class="acknowledgement ack">
      Account deletion info powered by <a href="https://justdeleteme.xyz/" target="_blank" rel="noopener">justdeleteme</a>
    </div>
  </div>
  <!-- Load the bundled popup script from dist so bare imports are resolved at build time -->
  <script type="module" src="../../dist/popup.js"></script>
</body>
</html>
