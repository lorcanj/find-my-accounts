<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Scanner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Account Scanner</h1>
    
    <div class="actions">
      <button id="scanGmail" class="btn btn-primary">
        Scan Gmail
      </button>
    </div>

    <div id="importContainer" style="margin-top:1em;">
      <h3>Import .mbox file (processed locally)</h3>
      <p style="font-size:0.9em; color:#444;">Choose an exported .mbox file (Google Takeout or Thunderbird). Files are processed locally in your browser and not uploaded by default.</p>
      <div class="file-picker">
        <input id="mboxFileInput" type="file" accept=".mbox" />
        <div id="selectedFileInfo" style="margin-top:0.5em; font-size:0.9em; color:#222;"></div>
      </div>
      <div style="margin-top:0.5em;">
        <button id="importMboxBtn" class="btn btn-primary" disabled>Import .mbox</button>
      </div>
    </div>

    <div id="accountListContainer">
      <ul id="accountList"></ul>
    </div>

    <div id="downloadContainer" style="margin-top: 1em; text-align: center;">
      <button id="downloadAccounts" class="btn btn-secondary">Download Accounts</button>
    </div>
    
    <div id="loading" class="loading" style="display: none;">
      <p>Scanning...</p>
    </div>

    <div id="results" class="results">
      <h2>Found Accounts: <span id="accountCount">0</span></h2>
      <ul id="accountList" class="account-list">
        <!-- Accounts will be added here by popup.js -->
      </ul>
    </div>

    <div id="error" class="error" style="display: none;">
      <!-- Error messages will appear here -->
    </div>
    <!-- Add this to popup.html, e.g., at the bottom of the popup -->
    <div class="acknowledgement" style="font-size: 0.9em; margin-top: 1em;">
      Account deletion info powered by <a href="https://justdeleteme.xyz/" target="_blank" rel="noopener">justdeleteme</a>
    </div>
  </div>
  <!-- Load the popup entry as an ES module; other modules are imported from popup.js -->
  <script type="module" src="popup.js"></script>
</body>
</html>
