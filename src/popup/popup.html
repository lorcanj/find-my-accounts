<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Scanner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Account Scanner</h1>
    
    <div class="actions">
      <button id="scanGmail" class="btn btn-primary">
        Scan Gmail
      </button>
    </div>

    <div id="accountListContainer">
      <ul id="accountList"></ul>
    </div>

    <div id="downloadContainer" style="margin-top: 1em; text-align: center;">
      <button id="downloadAccounts" class="btn btn-secondary">Download Accounts</button>
    </div>
    
    <div id="loading" class="loading" style="display: none;">
      <p>Scanning...</p>
    </div>

    <div id="results" class="results">
      <h2>Found Accounts: <span id="accountCount">0</span></h2>
      <ul id="accountList" class="account-list">
        <!-- Accounts will be added here by popup.js -->
      </ul>
    </div>

    <div id="error" class="error" style="display: none;">
      <!-- Error messages will appear here -->
    </div>
    <!-- Add this to popup.html, e.g., at the bottom of the popup -->
    <div class="acknowledgement" style="font-size: 0.9em; margin-top: 1em;">
      Account deletion info powered by <a href="https://justdeleteme.xyz/" target="_blank" rel="noopener">justdeleteme</a>
    </div>
  </div>
    <!--
    This popup loads several scripts in a specific order to ensure global functions and data are available:
    - justdeletemeData.js: Provides account deletion info.
    - buildDomainLookup.js: Builds a lookup table for account domains.
    - accountMatcher.js: Defines extractAccountsFromMessages and attaches it to window for global access.
    - popup.js: Handles UI logic and relies on extractAccountsFromMessages being available globally.
    Make sure to maintain this order so that popup.js can access the required functions and data.
  -->
  <script src="../models/Account.js"></script>
  <script src="../data/justdeletemeData.js"></script>
  <script src="../data/buildDomainLookup.js"></script>
  <script src="../scanners/accountMatcher.js"></script>
  <script src="download.js"></script>
  <script src="popup.js"></script>
</body>
</html>
