<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <!-- Dark Background -->
  <rect width="440" height="280" fill="#333333" />

  <!-- Stacked "Account Cards" (Left side) -->
  <g transform="translate(40, 40)">
    
    <!-- Card 3 (Back) - Orange/Yellow -->
    <g transform="translate(0, 80)">
      <foreignObject width="140" height="120">
         <div xmlns="http://www.w3.org/1999/xhtml" style="width:140px;height:120px;background:#F4B400;border-radius:10px 10px 0 0;box-shadow: 2px 2px 5px rgba(0,0,0,0.3);"></div>
      </foreignObject>
      <rect x="25" y="30" width="50" height="60" fill="rgba(255,255,255,0.3)" rx="4" />
    </g>

    <!-- Card 2 (Middle) - Green -->
    <g transform="translate(60, 40)">
      <foreignObject width="140" height="160">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width:140px;height:160px;background:#0F9D58;border-radius:10px 10px 0 0;box-shadow: 2px 2px 5px rgba(0,0,0,0.3);"></div>
      </foreignObject>
       <!-- Lines -->
      <rect x="20" y="30" width="60" height="8" fill="rgba(255,255,255,0.4)" rx="4" />
      <rect x="20" y="50" width="40" height="8" fill="rgba(255,255,255,0.4)" rx="4" />
    </g>

    <!-- Card 1 (Front) - Blue -->
    <g transform="translate(120, 0)">
       <!-- Main white card body with blue top -->
      <foreignObject width="180" height="200">
         <div xmlns="http://www.w3.org/1999/xhtml" style="width:180px;height:200px;background:#f5f5f5;border-radius:10px 10px 0 0;box-shadow: 2px 2px 8px rgba(0,0,0,0.4);border:1px solid #ddd;overflow:hidden;">
            <div style="height:60px;background:#4285F4;width:100%;"></div>
         </div>
      </foreignObject>
      
      <!-- Content lines on the card -->
      <rect x="20" y="80" width="140" height="10" fill="#e0e0e0" rx="2" />
      <rect x="20" y="105" width="100" height="10" fill="#e0e0e0" rx="2" />
      <rect x="20" y="130" width="140" height="2" fill="#e0e0e0" />
      
      <!-- Small Logo Icon on Card Header (mail/envelope) -->
      <g transform="translate(20, 20) scale(1.4)">
        <!-- Envelope body (outline) -->
        <rect x="4" y="6" width="16" height="12" rx="1.2" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Envelope flap -->
        <path d="M4 6 L12 12 L20 6" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Large Logo Focal Point (Right Side) -->
  <g transform="translate(320, 140)">
    <!-- White Circle Background for Logo -->
    <circle cx="0" cy="0" r="85" fill="#333" stroke="#555" stroke-width="2" />
    
    <!-- Original Logo SVG Scaled Up -->
    <g transform="translate(-50, -50) scale(4.2)">
        <circle cx="12" cy="12" r="10" fill="none" stroke="#43eb34" stroke-width="2"></circle>
        <line x1="14.31" y1="8" x2="20.05" y2="17.94" stroke="#43eb34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>
        <line x1="9.69" y1="8" x2="21.17" y2="8" stroke="#43eb34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>
        <line x1="7.38" y1="12" x2="13.12" y2="2.06" stroke="#43eb34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>
        <line x1="9.69" y1="16" x2="3.95" y2="6.06" stroke="#43eb34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>
        <line x1="14.31" y1="16" x2="2.83" y2="16" stroke="#43eb34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>
        <line x1="16.62" y1="12" x2="10.88" y2="21.94" stroke="#43eb34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>
    </g>
  </g>
</svg>