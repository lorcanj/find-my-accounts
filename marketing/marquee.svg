<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2c" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1400" height="560" fill="url(#bg-gradient)" />

  <!-- Abstract Shapes / Cards -->
  <g transform="translate(100, 50)">
    
    <!-- Card 3 (Back) - Orange/Yellow -->
    <g transform="translate(0, 160)">
      <rect width="400" height="300" fill="#F4B400" rx="20" filter="url(#drop-shadow)" />
      <rect x="60" y="60" width="120" height="120" fill="rgba(255,255,255,0.3)" rx="10" />
      <rect x="60" y="220" width="200" height="20" fill="rgba(255,255,255,0.3)" rx="10" />
    </g>

    <!-- Card 2 (Middle) - Green -->
    <g transform="translate(180, 80)">
      <rect width="400" height="380" fill="#0F9D58" rx="20" filter="url(#drop-shadow)" />
      <rect x="60" y="80" width="180" height="24" fill="rgba(255,255,255,0.4)" rx="12" />
      <rect x="60" y="140" width="120" height="24" fill="rgba(255,255,255,0.4)" rx="12" />
      <rect x="60" y="200" width="240" height="24" fill="rgba(255,255,255,0.4)" rx="12" />
    </g>

    <!-- Card 1 (Front) - Blue -->
    <g transform="translate(360, 0)">
      <rect width="460" height="460" fill="#f5f5f5" rx="20" filter="url(#drop-shadow)" />
      <!-- Blue Header -->
      <path d="M 0 20 A 20 20 0 0 1 20 0 L 440 0 A 20 20 0 0 1 460 20 L 460 140 L 0 140 Z" fill="#4285F4" />
      
      <!-- Content lines on the card -->
      <rect x="60" y="200" width="340" height="24" fill="#e0e0e0" rx="12" />
      <rect x="60" y="260" width="240" height="24" fill="#e0e0e0" rx="12" />
      <rect x="60" y="320" width="300" height="24" fill="#e0e0e0" rx="12" />
      <rect x="60" y="380" width="180" height="24" fill="#e0e0e0" rx="12" />
      
      <!-- Small Logo Icon on Card Header (mail/envelope) -->
      <g transform="translate(60, 40) scale(3.5)">
        <rect x="4" y="6" width="16" height="12" rx="1.2" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 6 L12 12 L20 6" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Large Logo Focal Point (Right Side) -->
  <g transform="translate(1050, 280)">
    <!-- Dark Circle Background for Logo -->
    <circle cx="0" cy="0" r="200" fill="#222" stroke="#444" stroke-width="4" filter="url(#drop-shadow)" />
    
    <!-- Original Logo SVG Scaled Up -->
    <g transform="translate(-120, -120) scale(10)">
        <circle cx="12" cy="12" r="10" fill="none" stroke="#43eb34" stroke-width="2"></circle>
        <line x1="14.31" y1="8" x2="20.05" y2="17.94" stroke="#43eb34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>
        <line x1="9.69" y1="8" x2="21.17" y2="8" stroke="#43eb34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>
        <line x1="7.38" y1="12" x2="13.12" y2="2.06" stroke="#43eb34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>
        <line x1="9.69" y1="16" x2="3.95" y2="6.06" stroke="#43eb34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>
        <line x1="14.31" y1="16" x2="2.83" y2="16" stroke="#43eb34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>
        <line x1="16.62" y1="12" x2="10.88" y2="21.94" stroke="#43eb34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>
    </g>
  </g>
</svg>
