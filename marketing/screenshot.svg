<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.1"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="#f8f9fa"/>

  <!-- Popup Container -->
  <g transform="translate(280, 60) scale(2)">
    <!-- Popup Background -->
    <rect width="360" height="340" rx="8" fill="#ffffff" filter="url(#shadow)"/>

    <!-- Header -->
    <text x="16" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#202124">find my accounts</text>
    
    <!-- Support Button -->
    <rect x="230" y="16" width="76" height="26" rx="4" fill="#f0f0f0"/>
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#FF5E5B" transform="translate(236, 21) scale(0.5)"/>
    <text x="254" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="13.6" font-weight="500" fill="#333333">Support</text>

    <!-- Pop Out Icon -->
    <g transform="translate(318, 21) scale(0.66)">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" fill="none" stroke="#202124" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="15 3 21 3 21 9" fill="none" stroke="#202124" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="10" y1="14" x2="21" y2="3" fill="none" stroke="#202124" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Instructions -->
    <polygon points="0,0 8,5 0,10" fill="#547cd4" transform="translate(16, 62)"/>
    <text x="30" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#547cd4">Instructions</text>

    <!-- Choose File Button -->
    <rect x="16" y="95" width="94" height="34" rx="4" fill="#547cd4"/>
    <text x="63" y="117" font-family="system-ui, -apple-system, sans-serif" font-size="14.4" font-weight="400" fill="#ffffff" text-anchor="middle">Choose file</text>

    <!-- Start Scan Button -->
    <rect x="16" y="145" width="86" height="34" rx="4" fill="#547cd4"/>
    <text x="59" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="14.4" font-weight="400" fill="#ffffff" text-anchor="middle">Start scan</text>

    <!-- Download Icon -->
    <g transform="translate(112, 152) scale(0.8)">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="none" stroke="#202124" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="7 10 12 15 17 10" fill="none" stroke="#202124" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="12" y1="15" x2="12" y2="3" fill="none" stroke="#202124" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Found Accounts -->
    <text x="16" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#202124">Found Accounts: 0</text>

    <!-- Table Headers -->
    <text x="26" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="13.6" font-weight="700" fill="#333333">Account name</text>
    
    <text x="186" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="13.6" font-weight="700" fill="#333333">Deletion</text>
    <text x="186" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="13.6" font-weight="700" fill="#333333">difficulty</text>
    
    <text x="270" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="13.6" font-weight="700" fill="#333333">Link to</text>
    <text x="270" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="13.6" font-weight="700" fill="#333333">delete</text>

    <!-- Horizontal Line -->
    <line x1="16" y1="280" x2="344" y2="280" stroke="#dddddd" stroke-width="2"/>

    <!-- Footer -->
    <text x="16" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="14.4" font-weight="400" fill="#202124">Account deletion info powered by <tspan fill="#1a0dab" text-decoration="underline">justdeleteme</tspan></text>
  </g>
</svg>